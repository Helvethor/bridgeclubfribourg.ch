---
name: CI

on:
  push:
    branches:
    - main
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

env:
  ADMIN_PASSWORD_HASH: '$2y$04$hIywRDniTOt9nIkUbHhI6eKmBWPceDGe/6BKwUiO8TL4oxECbmwfy'
  APP_SECRET: ci-app-secret
  CADDY_MERCURE_JWT_SECRET: ci-mercure-secret
  HOSTNAME: localhost
  HTTP_PORT: 21917
  HTTPS_PORT: 21918
  HTTP3_PORT: 21919
  POSTGRES_CHARSET: utf8
  POSTGRES_DB: app
  POSTGRES_PASSWORD: app
  POSTGRES_USER: app
  POSTGRES_VERSION: 16
  SERVER_NAME: localhost

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests & Quality Gates
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Prepare writable bind mounts
      run: mkdir -p public/upload public/build public/turnament var && find public/upload public/build public/turnament -type d -exec chmod a+rwx {} +

    - name: Start development services
      run: docker compose -f compose.yaml -f compose.dev.yaml up --wait --build php database pdf

    - name: Check HTTP and Mercure reachability
      run: |
        curl -v -k --fail-with-body https://localhost:21918
        curl -v -k --fail-with-body https://localhost:21918/.well-known/mercure?topic=test

    - name: Setup test database
      run: |
        docker compose -f compose.yaml -f compose.dev.yaml exec -T php bin/console --env=test doctrine:database:create --if-not-exists
        docker compose -f compose.yaml -f compose.dev.yaml exec -T php bin/console --env=test doctrine:schema:create

    - name: Symfony Linters & Schema Validation
      run: |
        docker compose -f compose.yaml -f compose.dev.yaml exec -T php bin/console lint:yaml config
        docker compose -f compose.yaml -f compose.dev.yaml exec -T php bin/console lint:twig templates
        docker compose -f compose.yaml -f compose.dev.yaml exec -T php bin/console lint:container
        docker compose -f compose.yaml -f compose.dev.yaml exec -T php bin/console doctrine:schema:validate

    - name: Run PHPUnit Test Suite
      run: docker compose -f compose.yaml -f compose.dev.yaml exec -T php composer test

    - name: Setup Node.js for E2E Tests
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install NPM dependencies
      run: npm ci

    - name: Install Playwright browsers and dependencies
      run: npx playwright install --with-deps chromium

    - name: Run Playwright E2E browser tests
      env:
        BASE_URL: https://localhost:21918
      run: npm run test:e2e

    - name: Upload Playwright Report on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: var/playwright-report/
        retention-days: 7

    - name: Build production Docker image
      uses: docker/bake-action@v5
      with:
        pull: true
        load: false
        files: docker-bake.hcl
        set: |
          *.cache-from=type=gha,scope=${{github.ref}}
          *.cache-from=type=gha,scope=refs/heads/main
          *.cache-to=type=gha,scope=${{github.ref}},mode=max

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      statuses: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Lint Code Base
      uses: super-linter/super-linter/slim@v8
      env:
        FILTER_REGEX_INCLUDE: ^\.github/workflows/.*\.ya?ml$
        GITHUB_ACTIONS_CONFIG_FILE: actionlint.yaml
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VALIDATE_CHECKOV: false
        VALIDATE_TRIVY: false
        VALIDATE_BIOME_FORMAT: false
        VALIDATE_BIOME_LINT: false
        VALIDATE_GITHUB_ACTIONS_ZIZMOR: false
        VALIDATE_JSCPD: false
        VALIDATE_PHP_BUILTIN: false
        VALIDATE_PHP_PHPCS: false
        VALIDATE_PHP_PHPSTAN: false
        VALIDATE_PHP_PSALM: false
        VALIDATE_YAML: false
        VALIDATE_YAML_PRETTIER: false
