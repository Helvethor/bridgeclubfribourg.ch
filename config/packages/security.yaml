security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        admin_user:
            memory:
                users:
                    admin:
                        # bcrypt hash of the admin password from env — regenerate with: bin/console security:hash-password
                        password: '%env(string:ADMIN_PASSWORD_HASH)%'
                        roles: [ 'ROLE_ADMIN' ]

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: admin_user
            form_login:
                login_path: login
                check_path: login
            logout:
                path: logout
                target: login
                invalidate_session: true

    access_control:
      - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: plaintext
        providers:
            admin_user:
                memory:
                    users:
                        admin:
                            password: 'testpassword'
                            roles: [ 'ROLE_ADMIN' ]
