---
services:
  php:
    init: true
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      pdf:
        condition: service_started
    environment:
      SERVER_NAME: ${SERVER_NAME:?No server name provided}, php:80
      DEFAULT_URI: http://${SERVER_NAME:?No server name provided}:${HTTP_PORT:?No HTTP port provided}
      APP_SECRET: ${APP_SECRET:?No app secret provided}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?No admin password hash provided}
      PDF_SERVICE_URL: ${PDF_SERVICE_URL:-http://pdf:3000}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:?No Mercure JWT secret provided}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:?No Mercure JWT secret provided}
      # Run "composer require symfony/orm-pack" to install and configure Doctrine ORM
      DATABASE_URL: postgresql://${POSTGRES_USER:?No database user provided}:${POSTGRES_PASSWORD:?No database password provided}@database:5432/${POSTGRES_DB:?No database name provided}?serverVersion=${POSTGRES_VERSION:-16}&charset=${POSTGRES_CHARSET:-utf8}
      # Run "composer require symfony/mercure-bundle" to install and configure the Mercure integration
      MERCURE_URL: ${CADDY_MERCURE_URL:-http://php/.well-known/mercure}
      MERCURE_PUBLIC_URL: https://${HOSTNAME:?No host name provided}/.well-known/mercure
      MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET:?No Mercure JWT secret provided}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - name: http
        target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp

    #user: ${FIX_UID:-1000}:${FIX_GID:-1000}
    #cap_add:
    #  - NET_BIND_SERVICE
    #dns:
    #  - 8.8.8.8
    #  - 1.1.1.1
    #build:
      #network: host

# Mercure is installed as a Caddy module, prevent the Flex recipe from installing another service
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:?No Postgres version provided}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?No database name provided}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?No password provided}
      POSTGRES_USER: ${POSTGRES_USER:?No user provided}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB}", "-U", "${POSTGRES_USER}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

  node:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: sh -c "npm install && npm run build"

  pdf:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=45s
      - --log-level=info
      - --chromium-max-queue-size=5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  pdf_warmup:
    image: curlimages/curl:8.13.0
    restart: "no"
    depends_on:
      pdf:
        condition: service_started
    environment:
      PDF_SERVICE_URL: ${PDF_SERVICE_URL:-http://pdf:3000}
      PDF_WARMUP_COUNT: ${PDF_WARMUP_COUNT:-3}
      PDF_WARMUP_MAX_WAIT_SECONDS: ${PDF_WARMUP_MAX_WAIT_SECONDS:-30}
      PDF_WARMUP_RETRY_DELAY_SECONDS: ${PDF_WARMUP_RETRY_DELAY_SECONDS:-1}
    volumes:
      - ./bin/pdf-warmup:/usr/local/bin/pdf-warmup:ro
    entrypoint:
      - sh
      - /usr/local/bin/pdf-warmup

volumes:
  caddy_data:
  caddy_config:
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
  node_modules:
